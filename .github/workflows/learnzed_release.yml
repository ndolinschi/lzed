# LearnZed release builds (fork-specific; upstream Zed release workflows are
# gated on github.repository_owner == 'zed-industries').
name: learnzed_release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag to create/update (e.g. v0.1.0). Leave empty to only build artifacts."
        required: false
        default: ""

permissions:
  contents: read

concurrency:
  group: learnzed-release-${{ github.ref }}
  cancel-in-progress: false

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: "0"
  RUST_BACKTRACE: "1"

jobs:
  linux_x86_64:
    if: github.repository_owner != 'zed-industries'
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    env:
      CC: clang-18
      CXX: clang++-18
      LLD: /usr/bin/ld.lld-18
    steps:
      - uses: actions/checkout@v4
      - uses: Swatinem/rust-cache@v2
        with:
          key: learnzed-release-linux
      - name: Install Linux build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y clang-18 lld-18 musl-tools
          ./script/linux
      - name: Download WASI SDK
        run: ./script/download-wasi-sdk
      - name: Bundle (unsigned, no Sentry)
        run: ./script/bundle-linux --skip-sentry
      - name: Rename artifact
        run: mv target/release/zed-linux-x86_64.tar.gz learnzed-linux-x86_64.tar.gz
      - uses: actions/upload-artifact@v4
        with:
          name: learnzed-linux-x86_64
          path: learnzed-linux-x86_64.tar.gz
          if-no-files-found: error

  macos_aarch64:
    if: github.repository_owner != 'zed-industries'
    runs-on: macos-14
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - uses: Swatinem/rust-cache@v2
        with:
          key: learnzed-release-macos
      # script/bundle-mac hardcodes Zed's .app layout and signing/notarization;
      # without signing secrets we ship an unsigned binary tarball instead.
      - name: Build release binaries
        run: |
          script/generate-licenses
          cargo build --release --package zed --bin learnzed
          cargo build --release --package cli
      - name: Package tar.gz
        run: |
          set -euo pipefail
          dir=learnzed-macos-aarch64
          mkdir -p "$dir"
          cp target/release/learnzed "$dir/learnzed"
          cp target/release/cli "$dir/learnzed-cli"
          cp crates/zed/resources/app-icon.png "$dir/"
          cp LICENSE-GPL "$dir/"
          cat > "$dir/README.txt" <<'TXT'
          LearnZed (unsigned build). macOS may block it on first launch:
            xattr -dr com.apple.quarantine ./learnzed
            ./learnzed
          Exercises need python3 with numpy installed.
          TXT
          tar -czf learnzed-macos-aarch64.tar.gz "$dir"
      - uses: actions/upload-artifact@v4
        with:
          name: learnzed-macos-aarch64
          path: learnzed-macos-aarch64.tar.gz
          if-no-files-found: error

  windows_x86_64:
    if: github.repository_owner != 'zed-industries'
    runs-on: windows-2022
    timeout-minutes: 150
    steps:
      - uses: actions/checkout@v4
      - uses: Swatinem/rust-cache@v2
        with:
          key: learnzed-release-windows
      # script/bundle-windows.ps1 builds an Inno Setup installer and expects
      # zed.exe and signing; we ship a plain zip of the unsigned binaries.
      - name: Build release binaries
        shell: pwsh
        run: |
          cargo build --release --package zed --bin learnzed
          cargo build --release --package cli
      - name: Package zip
        shell: pwsh
        run: |
          $dir = "learnzed-windows-x86_64"
          New-Item -ItemType Directory -Force -Path $dir | Out-Null
          Copy-Item target\release\learnzed.exe "$dir\learnzed.exe"
          Copy-Item target\release\cli.exe "$dir\learnzed-cli.exe"
          Copy-Item LICENSE-GPL "$dir\"
          "LearnZed (unsigned build). Run learnzed.exe. Exercises need Python 3 with numpy." | Out-File "$dir\README.txt"
          Compress-Archive -Path "$dir\*" -DestinationPath "learnzed-windows-x86_64.zip" -Force
      - uses: actions/upload-artifact@v4
        with:
          name: learnzed-windows-x86_64
          path: learnzed-windows-x86_64.zip
          if-no-files-found: error

  publish:
    needs: [linux_x86_64, macos_aarch64, windows_x86_64]
    if: github.repository_owner != 'zed-industries' && (startsWith(github.ref, 'refs/tags/v') || inputs.tag != '')
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - name: Checksums
        run: cd dist && sha256sum * > SHA256SUMS.txt && cat SHA256SUMS.txt
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ inputs.tag != '' && inputs.tag || github.ref_name }}
          name: LearnZed ${{ inputs.tag != '' && inputs.tag || github.ref_name }}
          prerelease: ${{ contains(inputs.tag != '' && inputs.tag || github.ref_name, '-') }}
          generate_release_notes: true
          files: dist/*
          fail_on_unmatched_files: true
